name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, lab-05-from-lab-04]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    name: TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build --workspace=@dogfight/shared
      - run: npm run typecheck

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build --workspace=@dogfight/shared
      - run: npm run build --workspace=@dogfight/server
      - run: |
          node server/dist/src/index.js &
          SERVER_PID=$!
          npm run dev --workspace=@dogfight/client &
          VITE_PID=$!

          # Wait for game server to be ready (bounded 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1; then
              echo "Game server ready on http://localhost:3000"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Game server not ready after 30s" >&2
              kill $SERVER_PID $VITE_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          # Wait for Vite dev server to be ready (bounded 30s)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173/ > /dev/null 2>&1; then
              echo "Vite dev server ready on http://localhost:5173"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Vite dev server not ready after 30s" >&2
              kill $SERVER_PID $VITE_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          npx playwright test
          TEST_EXIT=$?
          kill $SERVER_PID $VITE_PID 2>/dev/null || true
          exit $TEST_EXIT
        env:
          CI: true